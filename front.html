<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIE - Hydro-Resilient Index Engine | Satellite Underwriting</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070a11',
                            card: 'rgba(15, 23, 42, 0.75)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            green: '#10b981',
                            blue: '#3b82f6',
                            cyan: '#06b6d4',
                            amber: '#f59e0b',
                            red: '#ef4444',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet & Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <!-- React 18, ReactDOM 18, Babel, Framer Motion, Chart.js -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        body {
            background-color: #070a11;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.08) 0%, transparent 45%);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #map {
            height: 480px;
            width: 100%;
            border-radius: 16px;
        }

        .spinner-ring {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* SKELETON SHIMMER & SATELLITE BEAM ANIMATIONS */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(6, 182, 212, 0.15) 50%, rgba(255, 255, 255, 0.02) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite linear;
        }

        .radar-scan-beam {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #06b6d4, #10b981, transparent);
            box-shadow: 0 0 15px #06b6d4;
            animation: scanBeam 2s ease-in-out infinite alternate;
        }

        @keyframes scanBeam {
            0% { top: 0%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.2; }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .pulse-sat {
            animation: pulseGlow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="p-4 md:p-6 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || { motion: { div: 'div', header: 'header', button: 'button' }, AnimatePresence: React.Fragment };

        // Farm Location Presets
        const PRESET_FARMS = {
            tamilnadu: {
                name: '📍 Tamil Nadu Rice Field',
                lat: 13.0827, lng: 80.2707,
                coords: [[80.2707, 13.0827], [80.2750, 13.0827], [80.2750, 13.0870], [80.2707, 13.0870], [80.2707, 13.0827]]
            },
            punjab: {
                name: '📍 Punjab Wheat Field',
                lat: 30.9010, lng: 75.8573,
                coords: [[75.8573, 30.9010], [75.8620, 30.9010], [75.8620, 30.9050], [75.8573, 30.9050], [75.8573, 30.9010]]
            },
            california: {
                name: '📍 Sacramento Corn Field',
                lat: 38.5816, lng: -121.4944,
                coords: [[-121.4944, 38.5816], [-121.4890, 38.5816], [-121.4890, 38.5860], [-121.4944, 38.5860], [-121.4944, 38.5816]]
            }
        };

        const STEPS = [
            { id: 1, title: 'Step 1: Spatial Onboarding', icon: '🗺️', sub: 'Field Boundary & SRTM Topography' },
            { id: 2, title: 'Step 2: Canopy & Hydrology', icon: '🌿', sub: 'Soil Moisture & Spectral Graphs' },
            { id: 3, title: 'Step 3: Risk & Vulnerability', icon: '⚡', sub: 'HVI Dossier & Safety Locks' },
            { id: 4, title: 'Step 4: Actuarial Payout', icon: '💵', sub: 'Parametric Claim Settlement' }
        ];

        function App() {
            const [currentStep, setCurrentStep] = useState(1);
            const [selectedFarm, setSelectedFarm] = useState('tamilnadu');
            const [isLoading, setIsLoading] = useState(false);
            const [loadingStage, setLoadingStage] = useState(1);
            const [metrics, setMetrics] = useState(null);
            const [satImagery, setSatImagery] = useState(null);
            const [vulnDossier, setVulnDossier] = useState(null);
            const [history, setHistory] = useState(null);
            const [payoutData, setPayoutData] = useState(null);
            const [sumInsured, setSumInsured] = useState(10000);
            const [currentCoords, setCurrentCoords] = useState(PRESET_FARMS.tamilnadu.coords);
            const [showDossier, setShowDossier] = useState(false);

            const mapRef = useRef(null);
            const drawnItemsRef = useRef(null);
            const soilChartRef = useRef(null);
            const opticalChartRef = useRef(null);
            const soilChartInstance = useRef(null);
            const opticalChartInstance = useRef(null);

            // Animated Loading Stage Ticker
            useEffect(() => {
                let interval;
                if (isLoading) {
                    setLoadingStage(1);
                    interval = setInterval(() => {
                        setLoadingStage(prev => (prev < 5 ? prev + 1 : prev));
                    }, 800);
                }
                return () => clearInterval(interval);
            }, [isLoading]);

            // Initialize Leaflet Map on Mount
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (mapRef.current) return;

                    const map = L.map('map').setView([13.0827, 80.2707], 15);
                    mapRef.current = map;

                    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                        maxZoom: 20,
                        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                    }).addTo(map);

                    const drawnItems = new L.FeatureGroup();
                    drawnItemsRef.current = drawnItems;
                    map.addLayer(drawnItems);

                    const drawControl = new L.Control.Draw({
                        draw: { polygon: true, rectangle: true, polyline: false, circle: false, marker: false, circlemarker: false },
                        edit: { featureGroup: drawnItems }
                    });
                    map.addControl(drawControl);

                    map.on(L.Draw.Event.CREATED, (e) => {
                        const layer = e.layer;
                        drawnItems.clearLayers();
                        drawnItems.addLayer(layer);

                        const rawCoords = layer.getLatLngs()[0];
                        const formatted = rawCoords.map(pt => [pt.lng, pt.lat]);
                        formatted.push(formatted[0]);

                        setCurrentCoords(formatted);
                        fetchAnalysis(formatted, sumInsured);
                    });

                    loadPreset('tamilnadu');
                }, 100);

                return () => clearTimeout(timer);
            }, []);

            const buildCharts = (h) => {
                if (!h || !h.dates || !h.dates.length) return;

                setTimeout(() => {
                    if (!soilChartRef.current || !opticalChartRef.current) return;

                    if (soilChartInstance.current) soilChartInstance.current.destroy();
                    if (opticalChartInstance.current) opticalChartInstance.current.destroy();

                    const ctxSoil = soilChartRef.current.getContext('2d');
                    const ctxOptical = opticalChartRef.current.getContext('2d');

                    soilChartInstance.current = new Chart(ctxSoil, {
                        type: 'line',
                        data: {
                            labels: h.dates,
                            datasets: [
                                {
                                    label: 'VSM % (Soil Moisture)',
                                    data: h.vsm.map(v => (v * 100).toFixed(1)),
                                    borderColor: '#3b82f6',
                                    backgroundColor: 'rgba(59, 130, 246, 0.15)',
                                    fill: true,
                                    tension: 0.35,
                                    pointRadius: 3
                                },
                                {
                                    label: 'SMDI Deficit Index',
                                    data: h.smdi,
                                    borderColor: '#f59e0b',
                                    borderDash: [4, 4],
                                    tension: 0.35,
                                    pointRadius: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } },
                                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } }
                            },
                            plugins: { legend: { labels: { color: '#f3f4f6' } } }
                        }
                    });

                    opticalChartInstance.current = new Chart(ctxOptical, {
                        type: 'line',
                        data: {
                            labels: h.dates,
                            datasets: [
                                {
                                    label: 'NDVI (Crop Health)',
                                    data: h.ndvi,
                                    borderColor: '#10b981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.15)',
                                    fill: true,
                                    tension: 0.35,
                                    pointRadius: 3
                                },
                                {
                                    label: 'NBR (Burn Ratio)',
                                    data: h.nbr,
                                    borderColor: '#ef4444',
                                    tension: 0.35,
                                    pointRadius: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } },
                                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } }
                            },
                            plugins: { legend: { labels: { color: '#f3f4f6' } } }
                        }
                    });
                }, 100);
            };

            useEffect(() => {
                if (history) {
                    buildCharts(history);
                }
            }, [history, currentStep]);

            const loadPreset = (key) => {
                const farm = PRESET_FARMS[key];
                if (!farm) return;

                setSelectedFarm(key);
                setCurrentCoords(farm.coords);

                if (mapRef.current && drawnItemsRef.current) {
                    drawnItemsRef.current.clearLayers();
                    const latLngs = farm.coords.map(pt => [pt[1], pt[0]]);
                    const poly = L.polygon(latLngs, { color: '#10b981', weight: 3, fillOpacity: 0.25 });
                    drawnItemsRef.current.addLayer(poly);
                    mapRef.current.fitBounds(poly.getBounds());
                }

                fetchAnalysis(farm.coords, sumInsured);
            };

            const fetchAnalysis = (coords, currentSum) => {
                setIsLoading(true);

                fetch('http://127.0.0.1:8000/api/hrie/analyze-plot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coordinates: coords })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setMetrics(data.plot_metrics);
                        setSatImagery(data.recent_satellite_imagery);
                        setVulnDossier(data.vulnerability_dossier);
                        setHistory(data.history);
                        buildCharts(data.history);
                    }
                })
                .finally(() => setIsLoading(false));

                fetch('http://127.0.0.1:8000/api/hrie/verify-payout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        coordinates: coords,
                        sum_insured: parseFloat(currentSum)
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setPayoutData(data);
                        if (data.vulnerability_dossier) setVulnDossier(data.vulnerability_dossier);
                    }
                });
            };

            const handleSumInsuredChange = (val) => {
                setSumInsured(val);
                if (currentCoords) {
                    fetchAnalysis(currentCoords, val);
                }
            };

            return (
                <div className="max-w-7xl mx-auto space-y-6 pb-12">
                    
                    {/* Header */}
                    <motion.header 
                        initial={{ opacity: 0, y: -20 }}
                        animate={{ opacity: 1, y: 0 }}
                        transition={{ duration: 0.5 }}
                        className="glass-panel p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-2xl"
                    >
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 bg-gradient-to-br from-cyan-400 to-emerald-500 rounded-xl flex items-center justify-center font-extrabold text-black text-xl shadow-lg shadow-emerald-500/20">
                                H
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                    Hydro-Resilient Index Engine <span className="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-semibold">HRIE 2.7</span>
                                </h1>
                                <p className="text-xs text-gray-400">Multi-Sensor Hydro-Vulnerability Assessment & Actuarial Underwriting</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <motion.button 
                                whileHover={{ scale: 1.05 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={() => setShowDossier(true)}
                                className="px-3.5 py-1.5 bg-blue-500/10 border border-blue-500/30 rounded-full text-blue-400 text-xs font-semibold hover:bg-blue-500/20 transition-all"
                            >
                                📜 Features Blueprint
                            </motion.button>

                            <div className="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 px-3.5 py-1.5 rounded-full text-emerald-400 text-xs font-semibold">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                GEE Online
                            </div>
                        </div>
                    </motion.header>

                    {/* Architectural Blueprint Modal */}
                    <AnimatePresence>
                        {showDossier && (
                            <motion.div 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[2000] p-4"
                                onClick={() => setShowDossier(false)}
                            >
                                <motion.div 
                                    initial={{ scale: 0.9, y: 20 }}
                                    animate={{ scale: 1, y: 0 }}
                                    exit={{ scale: 0.9, y: 20 }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="glass-panel p-6 md:p-8 rounded-3xl max-w-3xl w-full max-h-[85vh] overflow-y-auto space-y-6 border-blue-500/30 shadow-2xl"
                                >
                                    <div className="flex justify-between items-center border-b border-white/10 pb-4">
                                        <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                            🏛️ Systemic Vulnerabilities vs HRIE Solutions
                                        </h2>
                                        <button onClick={() => setShowDossier(false)} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
                                    </div>

                                    <div className="space-y-4 text-xs text-gray-300 leading-relaxed">
                                        <p className="italic text-gray-400 border-l-2 border-cyan-400 pl-3">
                                            "Contemporary agricultural insurance ecosystems suffer from systemic operational inefficiencies across the underwriting, risk-quantification, and claims-remediation lifecycle."
                                        </p>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                            <div className="p-4 bg-white/[0.02] border border-cyan-500/30 rounded-2xl space-y-2">
                                                <h3 className="font-bold text-cyan-400 text-sm">1. Micro-Topographic Underwriting</h3>
                                                <p className="text-gray-400">Replaces flat Gram Panchayat / district-level premium pricing with micro-plot SRTM elevation (30m) & 10-year decadal VSM baselines.</p>
                                            </div>
                                            <div className="p-4 bg-white/[0.02] border border-emerald-500/30 rounded-2xl space-y-2">
                                                <h3 className="font-bold text-emerald-400 text-sm">2. Ghost-Acreage & Pre-Harvest Fraud Shield</h3>
                                                <p className="text-gray-400">Eliminates fraudulent capital leakage & pre-existing harvest onboarding via automated Sentinel polygon boundaries, phenology checks & 5km peer Z-scores.</p>
                                            </div>
                                            <div className="p-4 bg-white/[0.02] border border-amber-500/30 rounded-2xl space-y-2">
                                                <h3 className="font-bold text-amber-400 text-sm">3. Calibrated Biomass Indemnity Engine</h3>
                                                <p className="text-gray-400">Replaces passive 100% total-loss ledgers with calibrated WCM+MDM+Topp physics inversion & weather cross-verification locks.</p>
                                            </div>
                                            <div className="p-4 bg-white/[0.02] border border-blue-500/30 rounded-2xl space-y-2">
                                                <h3 className="font-bold text-blue-400 text-sm">4. Reinsurance Liquidity Bridge</h3>
                                                <p className="text-gray-400">Resolves 6-to-12-month retrocession audit freezes with instant, automated Google Earth Engine deterministic satellite telemetry.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pt-2 text-right">
                                        <button onClick={() => setShowDossier(false)} className="px-5 py-2 bg-emerald-500 text-black font-bold text-xs rounded-xl hover:bg-emerald-400 transition-all">
                                            Close Blueprint
                                        </button>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* TOP STEPPER PROGRESS BAR */}
                    <div className="glass-panel p-3.5 rounded-2xl">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                            {STEPS.map((s) => {
                                const isActive = currentStep === s.id;
                                const isDone = currentStep > s.id;
                                return (
                                    <motion.button
                                        key={s.id}
                                        whileHover={{ scale: 1.02 }}
                                        whileTap={{ scale: 0.98 }}
                                        onClick={() => setCurrentStep(s.id)}
                                        className={`p-3 rounded-xl flex items-center gap-3 text-left transition-all border ${
                                            isActive 
                                                ? 'bg-gradient-to-r from-cyan-500/20 to-emerald-500/20 border-cyan-500/50 text-white shadow-lg shadow-cyan-500/10' 
                                                : isDone 
                                                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                                                    : 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10'
                                        }`}
                                    >
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${
                                            isActive ? 'bg-cyan-400 text-black' : isDone ? 'bg-emerald-500 text-black' : 'bg-white/10 text-gray-400'
                                        }`}>
                                            {s.icon}
                                        </div>
                                        <div>
                                            <div className="text-xs font-bold">{s.title}</div>
                                            <div className="text-[10px] opacity-75">{s.sub}</div>
                                        </div>
                                    </motion.button>
                                );
                            })}
                        </div>
                    </div>

                    {/* PERMANENT DOM CONTAINER WITH TOGGLED VISIBILITY FOR STABLE RENDERING */}
                    <div className="relative">
                        
                        {/* STEP 1: SPATIAL ONBOARDING & FIELD SELECTION */}
                        <div className={currentStep === 1 ? 'space-y-6 block' : 'hidden'}>
                            <div className="glass-panel p-6 rounded-2xl relative space-y-4">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                    <div>
                                        <h2 className="text-base font-bold text-white flex items-center gap-2">
                                            🗺️ Step 1: Field Boundary Polygon & Micro-Topography
                                        </h2>
                                        <p className="text-xs text-gray-400">Draw a custom polygon field boundary or select a preset farm below to initialize satellite telemetry.</p>
                                    </div>

                                    <div className="flex gap-2">
                                        {Object.keys(PRESET_FARMS).map(key => (
                                            <motion.button
                                                key={key}
                                                whileHover={{ scale: 1.04 }}
                                                whileTap={{ scale: 0.96 }}
                                                onClick={() => loadPreset(key)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all ${
                                                    selectedFarm === key 
                                                        ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-md'
                                                        : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'
                                                }`}
                                            >
                                                {PRESET_FARMS[key].name}
                                            </motion.button>
                                        ))}
                                    </div>
                                </div>

                                <div className="relative overflow-hidden rounded-2xl">
                                    <div id="map"></div>

                                    {/* ANIMATED SATELLITE TELEMETRY SKELETAL OVERLAY SCREEN */}
                                    <AnimatePresence>
                                        {isLoading && (
                                            <motion.div 
                                                initial={{ opacity: 0 }}
                                                animate={{ opacity: 1 }}
                                                exit={{ opacity: 0 }}
                                                className="absolute inset-0 bg-slate-950/90 backdrop-blur-lg z-[1000] p-6 flex flex-col justify-between overflow-hidden"
                                            >
                                                <div className="radar-scan-beam"></div>

                                                {/* Top Telemetry Header Badge */}
                                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-xl pulse-sat">
                                                            🛰️
                                                        </div>
                                                        <div>
                                                            <div className="text-sm font-bold text-white flex items-center gap-2">
                                                                Sentinel Spaceborne Telemetry Ingestion
                                                                <span className="text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full animate-pulse">GEE Server reduction</span>
                                                            </div>
                                                            <div className="text-xs text-gray-400">Executing Dual WCM + MDM + Topp Inversion Pipeline</div>
                                                        </div>
                                                    </div>
                                                    <div className="hidden sm:flex items-center gap-2 text-xs font-mono text-cyan-400">
                                                        <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                                        10m Pixel Matrix
                                                    </div>
                                                </div>

                                                {/* Middle Checklist Stage Progress */}
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-auto py-2">
                                                    <div className="space-y-2.5 text-xs">
                                                        <div className="font-bold text-gray-300 uppercase tracking-wider text-[11px]">Real-Time Processing Checkpoints</div>

                                                        {[

                                    <span>Settlement Latency Acceleration: <strong className="text-emerald-400">80% Time Reduction</strong></span>
                                    <span>Reinsurance Liquidity Audit: <strong className="text-cyan-400 font-mono">PASSED_GEE_TELEMETRY</strong></span>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* STEP NAVIGATION CONTROLS */}
                    <div className="flex justify-between items-center pt-4 border-t border-white/10">
                        <motion.button
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            onClick={() => setCurrentStep(prev => Math.max(1, prev - 1))}
                            disabled={currentStep === 1}
                            className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all ${
                                currentStep === 1 
                                    ? 'opacity-40 cursor-not-allowed bg-white/5 border-white/5 text-gray-500' 
                                    : 'bg-white/10 border-white/20 text-white hover:bg-white/20'
                            }`}
                        >
                            ← Previous Step
                        </motion.button>

                        <div className="text-xs text-gray-400 font-semibold">
                            Step {currentStep} of 4
                        </div>

                        <motion.button
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            onClick={() => setCurrentStep(prev => Math.min(4, prev + 1))}
                            disabled={currentStep === 4}
                            className={`px-6 py-2.5 rounded-xl text-xs font-bold border transition-all ${
                                currentStep === 4 
                                    ? 'opacity-40 cursor-not-allowed bg-white/5 border-white/5 text-gray-500' 
                                    : 'bg-gradient-to-r from-cyan-500 to-emerald-500 border-emerald-400 text-black hover:opacity-90 shadow-lg shadow-emerald-500/20'
                            }`}
                        >
                            Next Step →
                        </motion.button>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
